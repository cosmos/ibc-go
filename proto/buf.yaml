# SPDX-License-Identifier: Apache-2.0

version: v1
name: buf.build/cosmos/ibc
deps:
  - buf.build/cosmos/cosmos-sdk:65fa41963e6a41dd95a35934239029df
  - buf.build/cosmos/cosmos-proto
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
  - buf.build/protocolbuffers/wellknowntypes
  - buf.build/cosmos/ics23:b1abd8678aab07165efd453c96796a179eb3131f
breaking:
  use:
    - FILE
  except:
    # go_package follows the Go module path, which changes on major version bumps and
    # changed with the move to github.com/lfdt-ibc. It does not affect the wire format.
    - FILE_SAME_GO_PACKAGE
lint:
  use:
    - STANDARD
    - COMMENTS
    - FILE_LOWER_SNAKE_CASE
  except:
    - UNARY_RPC
    - COMMENT_FIELD
    - SERVICE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
