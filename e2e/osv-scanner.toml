id = "GO-2026-5932"
reason = "Ignored because no fixed golang.org/x/crypto release exists (the openpgp package is deprecated). It reaches ibc-go only through cosmos-sdk crypto/armor (keyring key import/export) and has to be removed upstream in cosmos-sdk."

[[IgnoredVulns]]
id = "GO-2026-4883"
reason = "Ignored because no fixed release exists for github.com/docker/docker or github.com/moby/moby (only for the moby/moby/v2 daemon module), and interchaintest still requires both at v28.5.2. Not exploitable here: the bug is in the Docker daemon (plugin privilege validation), and e2e only uses the Docker client and API types."

