# SPDX-License-Identifier: Apache-2.0

name: Dependabot Tidy

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    timeout-minutes: 15
    if: github.actor == 'dependabot[bot]'
    permissions:
      actions: write # dispatch PR checks for the tidy commit
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Run make tidy-all
        run: make tidy-all

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes after make tidy-all"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes if any
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          signoff="Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git diff --cached --name-only --diff-filter=d -z |
            while IFS= read -r -d '' path; do
              jq -n --arg path "$path" --rawfile contents <(base64 -w0 "$path") \
                '{path: $path, contents: $contents}'
            done | jq -s . > "$RUNNER_TEMP/additions.json"

          git diff --cached --name-only --diff-filter=D -z |
            jq -R -s 'split("\u0000") | map(select(length > 0) | {path: .})' > "$RUNNER_TEMP/deletions.json"

          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }' \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            --arg body "$signoff" \
            --slurpfile additions "$RUNNER_TEMP/additions.json" \
            --slurpfile deletions "$RUNNER_TEMP/deletions.json" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $head,
              message: {headline: "chore: run make tidy-all", body: $body},
              fileChanges: {additions: $additions[0], deletions: $deletions[0]}
            }}}' > "$RUNNER_TEMP/request.json"

          gh api graphql --input "$RUNNER_TEMP/request.json" --jq '.data.createCommitOnBranch.commit.url'

      - name: Run PR checks on tidy commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for workflow in test.yml golangci.yml e2e.yaml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done
