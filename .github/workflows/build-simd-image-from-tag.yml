# SPDX-License-Identifier: Apache-2.0

name: Build Simd Image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag of the image to build'
        required: true
        type: string
      ibc-go-version:
        description: 'The ibc-go version to be added as a label'
        required: true
        type: string
  # Called by release.yml for every vX.Y.Z tag.
  workflow_call:
    inputs:
      tag:
        description: 'The tag of the image to build'
        required: true
        type: string
      ibc-go-version:
        description: 'The ibc-go version to be added as a label'
        required: true
        type: string

permissions: {}

env:
   REGISTRY: ghcr.io
   ORG: cosmos
   IMAGE_NAME: ibc-go-simd
   GIT_TAG: "${{ inputs.tag }}"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
    build-image-at-tag:
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      permissions:
        packages: write
        contents: read
        id-token: write
        attestations: write
        artifact-metadata: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
           with:
            ref: "${{ env.GIT_TAG }}"
            fetch-depth: 0
         - name: Log in to the Container registry
           uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
           with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
         - name: Build and push image
           id: push
           run: |
            # remove any `/` characters from the docker tag and replace them with a -
            docker_tag="$(echo $GIT_TAG | sed 's/[^a-zA-Z0-9\.]/-/g')"
            docker build . -t "${REGISTRY}/${ORG}/${IMAGE_NAME}:${docker_tag}" --build-arg IBC_GO_VERSION=${{ inputs.ibc-go-version }}
            docker push "${REGISTRY}/${ORG}/${IMAGE_NAME}:${docker_tag}"
            digest=$(docker buildx imagetools inspect "${REGISTRY}/${ORG}/${IMAGE_NAME}:${docker_tag}" \
              --format '{{json .Manifest}}' | jq -r .digest)
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
         - name: Attest build provenance
           uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
           with:
              subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
              subject-digest: ${{ steps.push.outputs.digest }}
              push-to-registry: true
         - name: Generate SBOM
           uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
           with:
              image: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
              format: spdx-json
              output-file: sbom.spdx.json
              upload-artifact: false
              upload-release-assets: false
         - name: Attest SBOM
           uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
           with:
              subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
              subject-digest: ${{ steps.push.outputs.digest }}
              sbom-path: sbom.spdx.json
              push-to-registry: true
         - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
         - name: Sign image
           env:
              DIGEST: ${{ steps.push.outputs.digest }}
           # --recursive also covers the platform manifests if docker pushed an index.
           run: cosign sign --yes --recursive "${REGISTRY}/${ORG}/${IMAGE_NAME}@${DIGEST}"
