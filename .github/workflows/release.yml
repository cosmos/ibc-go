# SPDX-License-Identifier: Apache-2.0

name: Release
# Builds a signed source archive, SBOM and build provenance for every ibc-go and
# 08-wasm tag, and attaches them to a draft release so they exist before publishing.

on:
  push:
    tags:
      - "v*"
      - "modules/light-clients/08-wasm/v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.tag.outputs.name }}
      title: ${{ steps.tag.outputs.title }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      paths: ${{ steps.tag.outputs.paths }}
    steps:
      - name: Check tag format
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^(modules/light-clients/08-wasm/)?(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag must match vX.Y.Z[-<suffix>] or modules/light-clients/08-wasm/vX.Y.Z[-<suffix>]"
            exit 1
          fi
          module="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          suffix="${BASH_REMATCH[3]}"
          if [[ -n "$module" ]]; then
            name="ibc-go-08-wasm-${version}"
            paths="modules/light-clients/08-wasm LICENSE NOTICE"
          else
            name="ibc-go-${version}"
            # Empty means the whole repository.
            paths=""
          fi
          {
            echo "name=${name}"
            echo "title=${TAG}"
            if [[ -n "$suffix" ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
            echo "paths=${paths}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build source archive
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 20
    env:
      NAME: ${{ needs.validate-tag.outputs.name }}
      PATHS: ${{ needs.validate-tag.outputs.paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Collect assets
        run: |
          mkdir -p out/assets out/sbom out/attestations src
          # git archive output is reproducible: entries are sorted and use the commit timestamp.
          # PATHS is left unquoted so it splits into pathspecs; empty means the whole repository.
          # shellcheck disable=SC2086
          git archive --format=tar --prefix="${NAME}/" "$GITHUB_SHA" -- $PATHS \
            | gzip -n > "out/assets/${NAME}.tar.gz"
          tar -xzf "out/assets/${NAME}.tar.gz" -C src
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: src/${{ env.NAME }}
          format: spdx-json
          output-file: out/sbom/${{ env.NAME }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/assets/*
      - name: Collect provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" out/attestations/provenance.json
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/assets/*
          sbom-path: out/sbom/${{ env.NAME }}.spdx.json
      - name: Collect SBOM bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" out/attestations/sbom.json
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: out/
          if-no-files-found: error
          retention-days: 7

  # This job is kept identical across cosmos/ibc, cosmos/ibc-go and cosmos/ibc-contracts.
  # Repository-specific behaviour belongs in the tag patterns, validate-tag and build.
  release:
    name: Attach signed assets to draft release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.validate-tag.outputs.name }}
      TITLE: ${{ needs.validate-tag.outputs.title }}
      PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
    steps:
      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*
          path: out
          merge-multiple: true
      - name: Assemble assets
        run: |
          mkdir dist
          mv out/assets/* out/sbom/* dist/
          (cd dist && sha256sum -- * > checksums.txt && cat checksums.txt)
          jq -c . out/attestations/*.json > "dist/${NAME}.intoto.jsonl"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Write verification notes
        env:
          CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          # Use the first release asset that is not an SBOM, checksum or attestation file as the example.
          for path in dist/*; do
            case "$path" in
              *.spdx.json | *.intoto.jsonl | dist/checksums.txt*) ;;
              *) example="${path#dist/}" && break ;;
            esac
          done
          cat > verify.md <<EOF
          ## Verifying the release

          Verify the build provenance of a release asset. Add
          \`--predicate-type https://spdx.dev/Document/v2.3\` to verify its SBOM instead, or
          \`--bundle ${NAME}.intoto.jsonl\` to verify offline:

          \`\`\`sh
          gh attestation verify ${example} \\
            --repo ${GH_REPO} \\
            --signer-workflow ${GITHUB_WORKFLOW_REF%@*} \\
            --source-ref ${GITHUB_REF}
          \`\`\`

          Or verify the signed checksums and then the assets against them:

          \`\`\`sh
          cosign verify-blob checksums.txt \\
            --bundle checksums.txt.sigstore.json \\
            --certificate-identity "${CERT_IDENTITY}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing checksums.txt
          # or, on macOS without sha256sum:
          shasum -a 256 --check --ignore-missing checksums.txt
          \`\`\`
          EOF
      - name: Create or update draft release
        run: |
          if ! is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            prerelease=()
            if [[ "$PRERELEASE" == "true" ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --draft \
              "${prerelease[@]}" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file verify.md
            exit 0
          fi

          if [[ "$is_draft" == "true" ]]; then
            # A draft already exists, either from a previous run or drafted in the UI for this tag.
            gh release upload "$TAG" dist/* --clobber
          else
            # The release was published before this workflow finished. Without --clobber, gh
            # refuses to replace assets that people may already have downloaded.
            echo "::warning::Release $TAG was published before its signed assets were attached"
            gh release upload "$TAG" dist/*
          fi

          body=$(gh release view "$TAG" --json body --jq .body)
          if [[ "$body" != *"## Verifying the release"* ]]; then
            printf '%s\n\n%s\n' "$body" "$(cat verify.md)" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
