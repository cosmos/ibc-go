# SPDX-License-Identifier: Apache-2.0

name: Release
# Builds a signed source archive, SBOM and build provenance for every ibc-go and
# 08-wasm tag, and attaches them to a draft release so they exist before publishing.

on:
  push:
    tags:
      - "v*"
      - "modules/light-clients/08-wasm/v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

env:
  TAG: ${{ github.ref_name }}

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.tag.outputs.name }}
      paths: ${{ steps.tag.outputs.paths }}
    steps:
      - name: Check tag format
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^(modules/light-clients/08-wasm/)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must match vX.Y.Z[-<suffix>] or modules/light-clients/08-wasm/vX.Y.Z[-<suffix>]"
            exit 1
          fi
          case "$TAG" in
            modules/light-clients/08-wasm/*)
              echo "name=ibc-go-08-wasm-${TAG##*/}" >> "$GITHUB_OUTPUT"
              echo "paths=modules/light-clients/08-wasm LICENSE NOTICE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=ibc-go-${TAG}" >> "$GITHUB_OUTPUT"
              echo "paths=" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build source archive
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 20
    env:
      NAME: ${{ needs.validate-tag.outputs.name }}
      PATHS: ${{ needs.validate-tag.outputs.paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package
        run: |
          mkdir -p out/attestations src
          # git archive output is reproducible: entries are sorted and use the commit timestamp.
          # PATHS is left unquoted so it splits into pathspecs; empty means the whole repository.
          # shellcheck disable=SC2086
          git archive --format=tar --prefix="${NAME}/" "$GITHUB_SHA" -- $PATHS \
            | gzip -n > "out/${NAME}.tar.gz"
          tar -xzf "out/${NAME}.tar.gz" -C src
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: src/${{ env.NAME }}
          format: spdx-json
          output-file: out/${{ env.NAME }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/${{ env.NAME }}.tar.gz
      - name: Collect provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" out/attestations/provenance.json
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/${{ env.NAME }}.tar.gz
          sbom-path: out/${{ env.NAME }}.spdx.json
      - name: Collect SBOM bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" out/attestations/sbom.json
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach signed assets to draft release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.validate-tag.outputs.name }}
    steps:
      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: out
      - name: Assemble assets
        run: |
          mkdir dist
          mv out/*.tar.gz out/*.spdx.json dist/
          jq -c . out/attestations/*.json > "dist/${NAME}.intoto.jsonl"
          cd dist
          sha256sum -- *.tar.gz *.spdx.json > checksums.txt
          cat checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Write verification notes
        env:
          CERT_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cat > verify.md <<EOF
          ## Verifying the release

          Verify the build provenance of the source archive. Add
          \`--predicate-type https://spdx.dev/Document/v2.3\` to verify its SBOM instead, or
          \`--bundle ${NAME}.intoto.jsonl\` to verify offline:

          \`\`\`sh
          gh attestation verify ${NAME}.tar.gz \\
            --repo ${GH_REPO} \\
            --signer-workflow ${GITHUB_WORKFLOW_REF%@*} \\
            --source-ref ${GITHUB_REF}
          \`\`\`

          Or verify the signed checksums and then the archive against them:

          \`\`\`sh
          cosign verify-blob checksums.txt \\
            --bundle checksums.txt.sigstore.json \\
            --certificate-identity "${CERT_IDENTITY}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing checksums.txt
          # or, on macOS without sha256sum:
          shasum -a 256 --check --ignore-missing checksums.txt
          \`\`\`
          EOF
      - name: Create or update draft release
        run: |
          if ! is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            prerelease=()
            if [[ "${TAG##*/}" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --draft \
              "${prerelease[@]}" \
              --verify-tag \
              --title "$TAG" \
              --notes-file verify.md
            exit 0
          fi

          if [[ "$is_draft" == "true" ]]; then
            # A draft already exists, either from a previous run or drafted in the UI for this tag.
            gh release upload "$TAG" dist/* --clobber
          else
            # The release was published before this workflow finished. Without --clobber, gh
            # refuses to replace assets that people may already have downloaded.
            echo "::warning::Release $TAG was published before its signed assets were attached"
            gh release upload "$TAG" dist/*
          fi

          body=$(gh release view "$TAG" --json body --jq .body)
          if [[ "$body" != *"## Verifying the release"* ]]; then
            printf '%s\n\n%s\n' "$body" "$(cat verify.md)" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
