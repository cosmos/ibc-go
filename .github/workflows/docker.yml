# SPDX-License-Identifier: Apache-2.0

name: Docker Build & Push Simapp (main)
# Build & Push builds the simapp docker image on every push to main and
# and pushes the image to https://ghcr.io/cosmos/ibc-go-simd
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v*
    paths:
      - '.github/workflows/docker.yml'
      - '**.go'

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ibc-go-simd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}

    - name: Compute release branch tag
      id: reltag
      if: startsWith(github.ref_name, 'release/v')
      shell: bash
      run: |
        RAW="${GITHUB_REF_NAME}"
        SANITIZED="${RAW//\//-}"
        echo "full_tag=${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}:branch-${SANITIZED}" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        build-args: |
          IBC_GO_VERSION=${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=min

    - name: Test simd is runnable
      run: |
        docker run --rm ${{ steps.meta.outputs.tags }}
    - name: Log in to the Container registry
      uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      id: push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        push: true
        # Disable BuildKit's unsigned attestation, so the pushed digest is the image itself
        # rather than an index wrapping it.
        provenance: false
        tags: |
          ${{ steps.meta.outputs.tags }}
          ${{ steps.reltag.outputs.full_tag }}
        build-args: |
          IBC_GO_VERSION=${{ github.ref_name }}
        cache-from: type=gha

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Generate SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        format: spdx-json
        output-file: sbom.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Attest SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.push.outputs.digest }}
        sbom-path: sbom.spdx.json
        push-to-registry: true

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: cosign sign --yes "${REGISTRY}/cosmos/${IMAGE_NAME}@${DIGEST}"
