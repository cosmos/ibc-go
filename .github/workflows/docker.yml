# SPDX-License-Identifier: Apache-2.0

name: Docker Build & Push Simapp (main)
# Build & Push builds the simapp docker images for linux/amd64 and linux/arm64 on every push to main
# and release branches and pushes them to https://ghcr.io/cosmos/ibc-go-simd and
# https://ghcr.io/cosmos/ibc-go-wasm-simd. Release tags get signed images from release.yml instead.
# There is deliberately no workflow_dispatch: a manual run can target a tag, and would then push an
# unsigned image over that release's signed image tag.
on:
  push:
    branches:
      - main
      - release/v*
    paths:
      - '.github/workflows/docker.yml'
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'

permissions: {}

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds, tests and pushes each platform image by digest on a native runner. merge then tags the
  # multi-platform image.
  docker-build:
    name: Build ${{ matrix.image }} linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [ibc-go-simd, ibc-go-wasm-simd]
        arch: [amd64, arm64]
        include:
          - image: ibc-go-simd
            file: Dockerfile
          - image: ibc-go-wasm-simd
            file: modules/light-clients/08-wasm/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

    - name: Build arguments
      id: args
      shell: bash
      run: |
        {
          echo "build-args<<EOF"
          if [[ "$IMAGE_NAME" == ibc-go-wasm-simd ]]; then
            # The libwasmvm release to link against, as required by the 08-wasm module.
            libwasm_version=$(awk '$1 == "github.com/CosmWasm/wasmvm/v3" { print $2 }' modules/light-clients/08-wasm/go.mod)
            if [[ -z "$libwasm_version" ]]; then
              echo "::error::No github.com/CosmWasm/wasmvm/v3 requirement in modules/light-clients/08-wasm/go.mod"
              exit 1
            fi
            echo "LIBWASM_VERSION=${libwasm_version}"
          else
            echo "IBC_GO_VERSION=${GITHUB_REF_NAME}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        load: true
        tags: ${{ matrix.image }}:test
        file: ${{ matrix.file }}
        platforms: linux/${{ matrix.arch }}
        build-args: ${{ steps.args.outputs.build-args }}
        cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        cache-to: type=gha,mode=min,scope=${{ matrix.image }}-${{ matrix.arch }}

    - name: Test simd is runnable
      run: |
        docker run --rm "${IMAGE_NAME}:test"

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image by digest
      id: push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: ${{ matrix.file }}
        platforms: linux/${{ matrix.arch }}
        build-args: ${{ steps.args.outputs.build-args }}
        cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        outputs: type=image,name=${{ env.REGISTRY }}/cosmos/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        mkdir -p "${RUNNER_TEMP}/digests"
        touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: digests-${{ matrix.image }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [docker-build]
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [ibc-go-simd, ibc-go-wasm-simd]
    env:
      IMAGE_NAME: ${{ matrix.image }}
    steps:
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-${{ matrix.image }}-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}

    - name: Compute release branch tag
      id: reltag
      if: startsWith(github.ref_name, 'release/v')
      shell: bash
      run: |
        RAW="${GITHUB_REF_NAME}"
        SANITIZED="${RAW//\//-}"
        echo "full_tag=${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}:branch-${SANITIZED}" >> "$GITHUB_OUTPUT"

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      shell: bash
      working-directory: ${{ runner.temp }}/digests
      env:
        TAGS: |
          ${{ steps.meta.outputs.tags }}
          ${{ steps.reltag.outputs.full_tag }}
      run: |
        tags=()
        while IFS= read -r tag; do
          if [[ -n "$tag" ]]; then
            tags+=(--tag "$tag")
          fi
        done <<< "$TAGS"
        sources=()
        for digest in *; do
          sources+=("${REGISTRY}/cosmos/${IMAGE_NAME}@sha256:${digest}")
        done
        if (( ${#sources[@]} != 2 )); then
          echo "::error::Expected an amd64 and an arm64 image, found ${#sources[@]}"
          exit 1
        fi
        docker buildx imagetools create "${tags[@]}" "${sources[@]}"
        docker buildx imagetools inspect "${tags[1]}"
