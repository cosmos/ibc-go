# SPDX-License-Identifier: Apache-2.0

name: Docker Build & Push Simapp (main)
# Build & Push builds the simapp docker images for linux/amd64 and linux/arm64 on every push to main
# and release branches that changes their inputs, and pushes them, unsigned, to
# https://ghcr.io/cosmos/ibc-go-simd and https://ghcr.io/cosmos/ibc-go-wasm-simd. Release branches cut
# before this workflow had these images keep the single-platform ibc-go-simd image their own copy
# builds. Release tags get signed images from release.yml instead.
# There is deliberately no workflow_dispatch: a manual run can target a tag, and would then push an
# unsigned image over that release's signed image tag.
on:
  push:
    branches:
      - main
      - release/v*
    paths:
      - '.github/workflows/docker.yml'
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Dockerfile'
      # Every ADD and COPY source of both Dockerfiles, so an image is rebuilt whenever its inputs
      # change. e2e-compatibility.yaml relies on this to tell from the recorded revision whether the
      # image is current.
      - 'internal/**'
      - 'simapp/**'
      - 'testing/**'
      - 'modules/**'
      - 'Makefile'
      - 'contrib/devtools/Makefile'
      - 'LICENSE'
      - 'NOTICE'

permissions: {}

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Lists the images and platforms once, for the docker-build and merge matrices.
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      builds: ${{ steps.matrix.outputs.builds }}
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
    - name: Build matrix
      id: matrix
      run: |
        # Every image is built for each of these platforms, on a native runner.
        platforms='[
          {"arch": "amd64", "runner": "ubuntu-24.04"},
          {"arch": "arm64", "runner": "ubuntu-24.04-arm"}
        ]'
        images='[
          {"image": "ibc-go-simd", "file": "Dockerfile"},
          {"image": "ibc-go-wasm-simd", "file": "modules/light-clients/08-wasm/Dockerfile"}
        ]'
        {
          echo "images=$(jq -c '[.[].image]' <<< "$images")"
          # One matrix entry per image and platform: image, file, arch and runner.
          echo "builds=$(jq -c --argjson platforms "$platforms" '[.[] as $image | $platforms[] | $image + .]' <<< "$images")"
          echo "platforms=$(jq -c '[.[].arch]' <<< "$platforms")"
        } >> "$GITHUB_OUTPUT"

  # Builds, tests and pushes each platform image by digest on a native runner. merge then tags the
  # multi-platform image.
  docker-build:
    name: Build ${{ matrix.image }} linux/${{ matrix.arch }}
    needs: [matrix]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.builds) }}
    env:
      IMAGE_NAME: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

    - name: Build arguments
      id: args
      run: |
        {
          echo "build-args<<EOF"
          if [[ "$IMAGE_NAME" == ibc-go-wasm-simd ]]; then
            # The libwasmvm release to link against, as required by the 08-wasm module. The first match is
            # the require line, which go mod tidy puts before any replace directive. Same lookup as in
            # release.yml and scripts/get-libwasm-version.py; change them together.
            libwasm_version=$(awk '$1 == "github.com/CosmWasm/wasmvm/v3" && $2 ~ /^v[0-9]/ { print $2; exit }' modules/light-clients/08-wasm/go.mod)
            if [[ -z "$libwasm_version" ]]; then
              echo "::error::No github.com/CosmWasm/wasmvm/v3 requirement in modules/light-clients/08-wasm/go.mod"
              exit 1
            fi
            echo "LIBWASM_VERSION=${libwasm_version}"
          else
            echo "IBC_GO_VERSION=${GITHUB_REF_NAME}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        load: true
        tags: ${{ matrix.image }}:test
        file: ${{ matrix.file }}
        platforms: linux/${{ matrix.arch }}
        build-args: ${{ steps.args.outputs.build-args }}
        cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        cache-to: type=gha,mode=min,scope=${{ matrix.image }}-${{ matrix.arch }}

    - name: Test simd is runnable
      run: |
        docker run --rm "${IMAGE_NAME}:test"

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image by digest
      id: push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: ${{ matrix.file }}
        platforms: linux/${{ matrix.arch }}
        build-args: ${{ steps.args.outputs.build-args }}
        cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        outputs: type=image,name=${{ env.REGISTRY }}/cosmos/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        mkdir -p "${RUNNER_TEMP}/digests"
        echo "$DIGEST" > "${RUNNER_TEMP}/digests/${ARCH}"

    - name: Upload digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: digests-${{ matrix.image }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 1

  # Runs even when some platform builds failed, so a failing build of one image does not stop the
  # other image from being tagged. An image with a missing platform fails here instead.
  merge:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [matrix, docker-build]
    if: ${{ !cancelled() && needs.matrix.result == 'success' }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    env:
      IMAGE_NAME: ${{ matrix.image }}
      PLATFORMS: ${{ needs.matrix.outputs.platforms }}
    steps:
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-${{ matrix.image }}-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}

    - name: Compute release branch tag
      id: reltag
      if: startsWith(github.ref_name, 'release/v')
      run: |
        RAW="${GITHUB_REF_NAME}"
        SANITIZED="${RAW//\//-}"
        echo "full_tag=${{ env.REGISTRY }}/cosmos/${{ env.IMAGE_NAME }}:branch-${SANITIZED}" >> "$GITHUB_OUTPUT"

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      env:
        TAGS: |
          ${{ steps.meta.outputs.tags }}
          ${{ steps.reltag.outputs.full_tag }}
      run: |
        tags=()
        while IFS= read -r tag; do
          if [[ -n "$tag" ]]; then
            tags+=(--tag "$tag")
          fi
        done <<< "$TAGS"
        sources=()
        while IFS= read -r arch; do
          file="${RUNNER_TEMP}/digests/${arch}"
          if [[ ! -f "$file" ]]; then
            echo "::error::The linux/${arch} build of ${IMAGE_NAME} did not succeed, so it is not tagged"
            exit 1
          fi
          sources+=("${REGISTRY}/cosmos/${IMAGE_NAME}@$(< "$file")")
        done < <(jq -r '.[]' <<< "$PLATFORMS")
        # e2e-compatibility.yaml reads the revision to tell whether the image is current.
        docker buildx imagetools create "${tags[@]}" \
          --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
          "${sources[@]}"
        docker buildx imagetools inspect "${tags[1]}"
